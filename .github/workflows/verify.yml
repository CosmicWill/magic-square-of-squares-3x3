name: verify

on:
  push:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Optional extras (checks SKIP cleanly without them)
        run: pip install sympy gmpy2 || true
      - name: Run verification suite
        run: python3 -m verify --ci
